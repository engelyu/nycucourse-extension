<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>當期選課</title>
  <link rel="stylesheet" href="planner.css">
  <link rel="stylesheet" href="reg-dialog.css">
</head>
<body>
  <header class="page-head">
    <h1>當期選課</h1>
    <div class="status-bar"><button id="refresh-status" type="button">從選課網更新狀態</button><span id="status-at" class="muted"></span></div>
    <div id="crawl" class="crawl">
      <div class="data-bar"><button class="btn-crawl" type="button">更新課程資料</button><span class="data-status muted"></span></div>
      <section class="crawl-progress" role="status" aria-live="polite" hidden>
        <div class="crawl-row"><span class="crawl-title"></span><span class="crawl-elapsed"></span></div>
        <div class="crawl-track"><div class="crawl-bar"></div></div>
        <div class="crawl-row"><span class="crawl-detail"></span><span class="crawl-percent"></span></div>
        <p class="crawl-hint"></p>
      </section>
      <p class="crawl-error hint" hidden></p>
      <p class="semester-warning hint" role="alert" hidden></p>
    </div>
    <p id="sys-banner" class="sys-banner" role="status" hidden></p>
  </header>
  <main class="layout">
    <section id="results-pane" class="results-pane" aria-label="搜尋結果">
      <div class="results-bar">
        <input id="keyword" type="search" placeholder="關鍵字：課名、老師或課號" aria-label="關鍵字" autocomplete="off">
        <label class="sort-label">排序 <select id="sort"></select></label>
      </div>
      <div id="applied" class="applied" hidden></div>
      <p id="summary" class="summary"></p>
      <p id="cos-hint" class="muted" hidden></p>
      <div id="results"></div>
    </section>
    <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="調整左右寬度" aria-controls="results-pane plan-pane" aria-valuemin="0" aria-valuemax="100" tabindex="0" title="拖曳調整寬度，雙擊回到預設"></div>
    <section id="plan-pane" class="plan-pane" aria-label="課表預覽與篩選設定">
      <div class="pane-tabs" role="tablist" aria-label="右欄">
        <button id="tab-preview" type="button" role="tab" aria-controls="panel-preview">課表預覽</button>
        <button id="tab-filters" type="button" role="tab" aria-controls="panel-filters">篩選設定</button>
        <button id="tab-auto" type="button" role="tab" aria-controls="panel-auto">自動登記</button>
      </div>
      <div id="panel-preview" class="pane-panel" role="tabpanel" aria-labelledby="tab-preview">
        <div id="legend" class="legend"></div>
        <p id="hidden-note" class="muted hidden-note" hidden></p>
        <div id="timetable" class="timetable"></div>
      </div>
      <div id="panel-filters" class="pane-panel" role="tabpanel" aria-labelledby="tab-filters" hidden>
        <section class="panel-block">
          <h3>時段</h3>
          <div class="toolbar">
            <button id="select-all" type="button">全選</button>
            <button id="select-free" type="button" title="全部時段扣掉已選上的課（已登記、預排、私人行程都算空堂）">空堂</button>
            <button id="clear" type="button">清除</button>
            <button id="undo" type="button" title="復原上一步（⌘Z／Ctrl+Z）" disabled>復原</button>
            <span id="count" class="muted"></span>
          </div>
          <p class="muted tip">框選想上課的時段，找出落在這些時段的課。按住拖曳可以框選；從已選的格子開始拖曳就是取消。點星期或節次可以整天、整節切換。「空堂」是扣掉已選上的課以外的所有時段。</p>
          <div id="grid-legend" class="legend"></div>
          <div id="grid" class="slot-grid"></div>
        </section>
        <form id="filters" class="filters" autocomplete="off"></form>
      </div>
      <div id="panel-auto" class="pane-panel auto-panel" role="tabpanel" aria-labelledby="tab-auto" hidden>
        <p class="muted tip">加退選期間每天都要重新登記。開啟後會在指定時間自動登記清單裡的預排課程，每門課每天只送一次，失敗不重試。需要選課網保持登入，瀏覽器也要開著。</p>
        <div class="auto-row">
          <label><input type="checkbox" id="auto-enabled"> 每天自動登記</label>
          <label>時間 <input type="time" id="auto-time" value="13:00"></label>
          <button id="auto-run" type="button">立刻執行一次</button>
          <span id="auto-next" class="muted"></span>
        </div>
        <p id="auto-warning" class="hint warn" hidden></p>
        <p id="auto-message" class="hint" role="status" hidden></p>
        <h3>清單</h3>
        <ul id="auto-list" class="auto-list"></ul>
        <div class="auto-row">
          <select id="auto-course" aria-label="要加入的預排課程"></select>
          <select id="auto-wish" aria-label="志願"></select>
          <button id="auto-add" type="button">加入清單</button>
        </div>
        <h3>最近結果</h3>
        <ul id="auto-log" class="auto-list"></ul>
      </div>
    </section>
  </main>
  <dialog id="detail" class="detail"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="planner.js"></script>
</body>
</html>
