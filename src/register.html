<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>正式選課</title>
  <link rel="stylesheet" href="schedule.css">
  <link rel="stylesheet" href="register.css">
  <link rel="stylesheet" href="reg-dialog.css">
</head>
<body>
  <header class="bar">
    <h1>正式選課</h1>
    <div class="bar-right">
      <button id="btn-refresh" type="button">重新讀取</button>
    </div>
  </header>

  <p class="warning">
    這裡是<strong>正式選課</strong>，按下加選會真的改變你的選課結果，和預排課程不同。
    每門課都會先向選課網確認能不能加選，再由你確認後送出。
  </p>
  <p id="closed" class="warning closed" role="alert" hidden></p>
  <p id="status" class="status"></p>
  <p id="message" class="status message" hidden></p>

  <main>
    <table id="table" hidden>
      <thead>
        <tr>
          <th>課號</th>
          <th>課名</th>
          <th>時間</th>
          <th>人數</th>
          <th>狀態</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden>
      預排課程是空的。先在 popup 搜尋課程加入預排，或到課表分頁按「從選課網同步」。
    </p>

    <section id="auto">
      <h2>每日自動登記</h2>
      <p class="auto-note">
        加退選期間每天都要重新登記。開啟後會在指定時間自動登記下面清單裡的課，
        每門課每天只送一次，失敗不重試。需要選課網保持登入，瀏覽器也要開著。
      </p>
      <div class="auto-row">
        <label><input type="checkbox" id="auto-enabled"> 每天自動登記</label>
        <label>時間 <input type="time" id="auto-time" value="13:00"></label>
        <button id="auto-run" type="button">立刻執行一次</button>
        <span id="auto-next" class="sub"></span>
      </div>
      <p id="auto-warning" class="status message" hidden></p>
      <div class="auto-row">
        <select id="auto-course"></select>
        <select id="auto-wish"></select>
        <button id="auto-add" type="button">加入清單</button>
      </div>
      <ul id="auto-list" class="manual-list"></ul>
      <h3>最近結果</h3>
      <ul id="auto-log" class="manual-list"></ul>
    </section>
  </main>


  <script type="module" src="register.js"></script>
</body>
</html>
